[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
clap = "4.6.7"
chess_fen_parser = "0.1.1"
ndarray = "0.17.2"
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng"] }
rand_distr = "0.6.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
my_torch = { path = "crates/my_torch" }
my_torch_analyzer = { path = "crates/my_torch_analyzer" }
cli_core = { path = "crates/cli_core" }
cli_test = { path = "crates/cli_test" }
