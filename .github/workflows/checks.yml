name: Checks

env:
  BINARY: "my_torch_analyzer"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }

      - uses: astral-sh/setup-uv@v7
      - name: Coding style
        run: uvx pre-commit run --all-files --show-diff-on-failure

      - name: Check binary
        run: |
          make
          ./$BINARY --help

      - run: cargo test --frozen
