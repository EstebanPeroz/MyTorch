{
  "inputs": 6,
  "layers": [
    { "neurons": 8, "activation": "softmax", "initialization": "he_normal" },
    { "neurons": 3, "activation": "identity", "initialization": "xavier_normal" }
  ],
  "training": {
    "loss": "softmax_cross_entropy",
    "optimizer": { "name": "sgd", "learning_rate": 0.01 },
    "batch_size": 64,
    "epochs": 100,
    "seed": 42,
    "early_stopping": { "validation": 0.1, "patience": 5 }
  }
}
